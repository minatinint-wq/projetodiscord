services:
  - type: web
    name: sesh-web
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        fromDatabase:
          name: sesh-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: SEED_DEMO_USER
        value: "true"
      - key: CREATOR_EMAIL
        sync: false

databases:
  - name: sesh-db
    plan: free
    region: virginia
    databaseName: sesh
    user: sesh
    ipAllowList: []
