services:
  - type: web
    name: sesh-web
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        fromDatabase:
          name: sesh-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: SEED_DEMO_USER
        value: "true"
      - key: AI_IMAGE_DAILY_LIMIT
        value: "5"
      - key: IMAGE_GENERATION_TIMEOUT_MS
        value: "120000"
      - key: NORMAL_HF_SPACE_URL
        value: https://black-forest-labs-flux-1-schnell.hf.space
      - key: NORMAL_HF_API_NAME
        value: infer
      - key: NSFW_HF_SPACE_URL
        value: https://black-forest-labs-flux-1-schnell.hf.space
      - key: NSFW_HF_API_NAME
        value: infer
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_IMAGE_MODEL
        value: "@cf/black-forest-labs/flux-1-schnell"
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_IMAGE_MODEL
        value: black-forest-labs/flux.1-schnell
      - key: MASTER_ADMIN_EMAIL
        sync: false
      - key: MASTER_ADMIN_EMAILS
        sync: false
      - key: MASTER_ADMIN_PASSWORD
        sync: false
      - key: CREATOR_EMAIL
        sync: false
      - key: SHORT_USERNAME_EMAILS
        sync: false
      - key: SESH_PUBLIC_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
  # Uma chamada externa a cada 10 min mantém o serviço acessível em planos
  # que não suspendem processos. Informe a URL pública após o primeiro deploy.
  - type: cron
    name: sesh-heartbeat
    runtime: node
    schedule: "*/10 * * * *"
    buildCommand: npm ci --omit=dev
    startCommand: node scripts/ping-service.cjs
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: SESH_PUBLIC_URL
        sync: false

databases:
  - name: sesh-db
    plan: free
    region: virginia
    databaseName: sesh
    user: sesh
    ipAllowList: []
