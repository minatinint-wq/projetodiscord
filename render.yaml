services:
  - type: web
    name: sesh-web
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        fromDatabase:
          name: sesh-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: SEED_DEMO_USER
        value: "true"
      - key: MASTER_ADMIN_EMAIL
        sync: false
      - key: MASTER_ADMIN_PASSWORD
        sync: false
      - key: CREATOR_EMAIL
        sync: false

  # Uma chamada externa a cada 10 min mantém o serviço acessível em planos
  # que não suspendem processos. Informe a URL pública após o primeiro deploy.
  - type: cron
    name: sesh-heartbeat
    runtime: node
    schedule: "*/10 * * * *"
    buildCommand: npm ci --omit=dev
    startCommand: node scripts/ping-service.cjs
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: SESH_PUBLIC_URL
        sync: false

databases:
  - name: sesh-db
    plan: free
    region: virginia
    databaseName: sesh
    user: sesh
    ipAllowList: []
