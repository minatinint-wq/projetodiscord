name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm test

      - name: Build Windows installer
        run: npm run dist:win

      - name: Publish installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeshDesktop-Setup-${{ github.sha }}
          path: release/SeshDesktop-Setup.exe
          if-no-files-found: error
          retention-days: 30
