name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm test

      - name: Set version and create its release tag
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $versionParts = $packageVersion.Split('.')
          $version = "$($versionParts[0]).$($versionParts[1]).${{ github.run_number }}"
          $tag = "v$version"
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          npm version $version --no-git-tag-version --allow-same-version
          if (-not (git ls-remote --tags origin "refs/tags/$tag")) {
            git tag $tag
            git push origin $tag
          }

      - name: Build Windows installer
        run: npm run dist:win

      - name: Publish complete auto-update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --target main --title $env:RELEASE_TAG --notes "Atualização automática do Sesh Desktop."
          }
          gh release upload $env:RELEASE_TAG release/SeshDesktop-Setup.exe release/SeshDesktop-Setup.exe.blockmap release/latest.yml --clobber

      - name: Publish installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeshDesktop-Setup-${{ github.run_number }}
          path: release/SeshDesktop-Setup.exe
          if-no-files-found: error
          retention-days: 30
